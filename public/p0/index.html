<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go Forge · P0 engine proof</title>
<style>
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; margin: 24px; max-width: 1100px; color: #111; background: #f7f6f0; }
  h1 { font-size: 16px; letter-spacing: .08em; text-transform: uppercase; }
  textarea { width: 100%; height: 340px; font: inherit; box-sizing: border-box; padding: 8px; border: 1px solid #111; background: #fff; tab-size: 4; }
  pre { white-space: pre-wrap; border: 1px solid #111; background: #fff; padding: 8px; min-height: 2em; margin: 4px 0 12px; }
  #stderr { color: #9b1c1c; }
  button, select { font: inherit; border: 1px solid #111; background: #fff; padding: 6px 14px; }
  button:disabled { opacity: .4; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #555; }
</style>
</head>
<body>
<h1>Go Forge · P0 · in-browser Go engine proof</h1>
<p>Real <code>cmd/compile</code> + <code>cmd/link</code> compiled to WebAssembly, running in a Web Worker. No server executes code.</p>
<div class="row">
  <select id="example"></select>
  <label>go directive <select id="lang"><option value="">default</option><option>go1.21</option><option>go1.22</option></select></label>
  <label>timeout ms <input id="timeout" type="number" value="5000" style="width:6em;font:inherit"></label>
  <button id="run" disabled>Loading engine…</button>
  <span id="status" data-testid="status"></span>
</div>
<textarea id="code" spellcheck="false"></textarea>
<div class="label">stdout</div><pre id="stdout" data-testid="stdout"></pre>
<div class="label">stderr</div><pre id="stderr" data-testid="stderr"></pre>
<div class="label">result</div><pre id="result" data-testid="result"></pre>
<details><summary class="label">capabilities()</summary><pre id="caps"></pre></details>

<script type="module">
import { WasmExecutor } from "/engine/executor.js";

const EXAMPLES = {
  "goroutines + WaitGroup + channel": `package main

import (
	"fmt"
	"sync"
)

func main() {
	results := make(chan int)
	var wg sync.WaitGroup
	for i := 1; i <= 5; i++ {
		wg.Add(1)
		go func() {
			defer wg.Done()
			results <- i * i
		}()
	}
	go func() {
		wg.Wait()
		close(results)
	}()
	sum := 0
	for r := range results {
		sum += r
	}
	fmt.Println("sum of squares:", sum)
}
`,
  "panic: index out of range": `package main

import "fmt"

func main() {
	xs := []int{1, 2, 3}
	i := 5
	fmt.Println("before")
	fmt.Println(xs[i])
}
`,
  "panic: nil map write": `package main

func main() {
	var m map[string]int
	m["boom"] = 1
}
`,
  "deadlock": `package main

import "fmt"

func main() {
	ch := make(chan int)
	fmt.Println("sending")
	ch <- 1
}
`,
  "loop variable capture (try go1.21)": `package main

import "fmt"

func main() {
	var fns []func()
	for i := 0; i < 3; i++ {
		fns = append(fns, func() { fmt.Print(i, " ") })
	}
	for _, f := range fns {
		f()
	}
	fmt.Println()
}
`,
  "infinite loop (timeout)": `package main

func main() {
	for {
	}
}
`,
  "compile error": `package main

import "fmt"

func main() {
	x := 1
	fmt.Println("hi")
}
`,
};

const $ = (id) => document.getElementById(id);
for (const name of Object.keys(EXAMPLES)) $("example").add(new Option(name, name));
$("code").value = EXAMPLES[$("example").value];
$("example").onchange = () => ($("code").value = EXAMPLES[$("example").value]);

const ex = new WasmExecutor({ baseUrl: "/engine/" });
window.__engine = ex;
const t0 = performance.now();
ex.ready().then((info) => {
  const ms = Math.round(performance.now() - t0);
  window.__coldStartMs = ms;
  $("status").textContent = `engine ready in ${ms} ms (${info.goVersion})`;
  $("caps").textContent = JSON.stringify({ ...ex.capabilities(), stdlib: `${ex.capabilities().stdlib.length} packages` }, null, 2);
  $("run").disabled = false;
  $("run").textContent = "Run";
}, (err) => {
  $("status").textContent = "ENGINE FAILED: " + err.message;
});

$("run").onclick = async () => {
  $("run").disabled = true;
  $("stdout").textContent = "";
  $("stderr").textContent = "";
  $("result").textContent = "";
  $("status").textContent = "compiling…";
  const r = await ex.run([{ name: "main.go", content: $("code").value }], {
    timeoutMs: Number($("timeout").value),
    lang: $("lang").value || undefined,
    onStdout: (s) => ($("stdout").textContent += s),
    onStderr: (s) => ($("stderr").textContent += s),
  });
  $("stdout").textContent = r.stdout;
  $("stderr").textContent = r.stderr;
  $("result").textContent = JSON.stringify({ status: r.status, exitCode: r.exitCode, compileMs: r.compileMs, linkMs: r.linkMs, runMs: r.runMs, totalMs: r.totalMs, engineError: r.engineError }, null, 2);
  $("status").textContent = `done: ${r.status}`;
  $("run").disabled = false;
  window.__lastResult = r;
};
</script>
</body>
</html>
