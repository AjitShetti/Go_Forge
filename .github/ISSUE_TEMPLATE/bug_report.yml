name: Bug report
description: Something on the site is broken or behaves wrongly
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address where it happened, e.g. /canvas/new or /engine
      placeholder: /engine
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, step by step, and what you saw. Paste any error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Windows 11 / Safari on iPhone
  - type: dropdown
    id: signed_in
    attributes:
      label: Were you signed in?
      options:
        - "Yes"
        - "No"
        - Not sure
